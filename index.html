<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CB TA TRADING · Org Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
<style>
/* Print-only elements (hidden on screen) */
.print-only { display: none; }

@media print {
  @page { size: A4 landscape; margin: 8mm 10mm; }

  /* Hide screen-only UI */
  .toolbar, .tweaks-panel, .twk-panel, .sidebar, .breadcrumb, .tb-zoom,
  .drag-hint, .toast, .modal-bg, .dept-multi-hud { display: none !important; }

  html, body {
    background: #fff !important;
    height: auto !important;
    overflow: visible !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  body { font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif; color: #0F172A; }
  #root { display: block !important; height: auto !important; min-height: auto !important; background: #fff !important; }

  /* The whole printed page locked to a fixed A4-landscape inner box, so all
     content (header / chart / footer) is guaranteed to fit on ONE sheet. */
  .app {
    display: grid !important;
    grid-template-rows: auto 1fr auto !important;
    grid-template-columns: 1fr !important;
    width: 100% !important;
    height: 194mm !important;
    max-height: 194mm !important;
    overflow: hidden !important;
    background: #fff !important;
    page-break-after: avoid !important;
    page-break-inside: avoid !important;
  }

  /* Show print-only header/footer */
  .print-only { display: block !important; }

  /* ── Print header ── */
  .print-header {
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 3mm 0;
    border-bottom: 1.2px solid #0F172A;
  }
  .ph-left { display: flex; align-items: center; gap: 10px; }
  .ph-logo {
    width: 38px; height: 38px; border-radius: 8px;
    object-fit: cover; flex-shrink: 0;
  }
  .ph-logo-fallback {
    display: grid; place-items: center;
    background: linear-gradient(135deg, #FF6B47, #FF8A3D);
    color: #fff; font-weight: 800; font-size: 16px;
  }
  .ph-org { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
  .ph-title { font-size: 11px; color: #475569; margin-top: 2px; }
  .ph-right { text-align: right; }
  .ph-meta { font-size: 9px; color: #94A3B8; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .ph-date { font-size: 13px; font-weight: 700; color: #0F172A; margin-top: 1px; }

  /* Chart wrapper takes the middle grid row (1fr) and clips the canvas.
     Other auto-row siblings (print-header, print-footer) keep their natural height. */
  .chart-area {
    min-height: 0 !important;
    height: 100% !important;
    overflow: hidden !important;
    position: relative !important;
  }

  .canvas {
    position: relative !important;
    inset: auto !important;
    width: 100% !important;
    height: 100% !important;
    min-height: 0 !important;
    background: #fff !important;
    overflow: hidden !important;
    border: 1px solid #E2E8F0;
    border-radius: 4px;
    page-break-inside: avoid;
  }
  .canvas::before, .canvas::after { display: none !important; }

  /* Vertical breathing room around the chart, achieved with padding on the
     parent grid cell so canvas can still use height: 100% safely. */
  .chart-area {
    padding: 3mm 0 !important;
    box-sizing: border-box !important;
  }

  /* Override on-screen transform with the print-fit transform computed in onExport */
  .canvas-inner {
    transform: var(--print-transform, none) !important;
    transform-origin: 0 0 !important;
  }

  /* Hide editing-only affordances inside cards */
  .sub-branch-card { cursor: default !important; }

  /* ── Footer (signatures) ── */
  .print-footer {
    display: block !important;
    page-break-inside: avoid;
    padding-top: 2mm;
  }
  .pf-row {
    display: flex !important;
    justify-content: space-between;
    gap: 10mm;
  }
  .pf-cell {
    flex: 1;
    text-align: center;
  }
  .pf-line {
    border-bottom: 1px solid #0F172A;
    margin: 7mm 0 3px 0;
  }
  .pf-role {
    font-size: 11px;
    font-weight: 700;
    color: #0F172A;
    margin-bottom: 2px;
  }
  .pf-name {
    font-size: 10px;
    color: #475569;
    margin-bottom: 2px;
  }
  .pf-date {
    font-size: 9px;
    color: #94A3B8;
  }
  .pf-note {
    margin-top: 3mm;
    text-align: center;
    font-size: 8px;
    color: #94A3B8;
    border-top: 0.5px dashed #CBD5E1;
    padding-top: 1.5mm;
  }
}

#__err{position:fixed;left:8px;top:8px;right:8px;max-height:60vh;overflow:auto;background:#fff3f0;color:#a00;padding:12px;border:1px solid #d33;font:12px/1.4 monospace;white-space:pre-wrap;z-index:99999;display:none}
</style>
</head>
<body>
<div id="root"></div>
<pre id="__err"></pre>

<script>
(function(){
  var box = document.getElementById('__err');
  function show(msg){
    box.style.display = 'block';
    box.textContent += msg + '\n\n';
  }
  window.addEventListener('error', function(e){
    show('ERROR: ' + (e.message || e) + '\n at ' + (e.filename||'?') + ':' + (e.lineno||'?'));
  });
  window.addEventListener('unhandledrejection', function(e){
    show('PROMISE REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  });
})();
</script>

<!-- Firebase SDK (compat builds — work with global script tags) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script>
// Cache-bust every load so edits show up without manual hard-refresh.
// Uses fetch + Babel.transform + eval so dynamic JSX scripts work properly.
(function(){
  var v = '?v=' + Date.now();
  var files = [
    ['src/firebase-init.js',   false],
    ['src/data.js',            false],
    ['tweaks-panel.jsx',       true ],
    ['src/utils.jsx',          true ],
    ['src/card.jsx',           true ],
    ['src/canvas.jsx',         true ],
    ['src/deptview.jsx',       true ],
    ['src/sidebar.jsx',        true ],
    ['src/toolbar.jsx',        true ],
    ['src/modals.jsx',         true ],
    ['src/auth.jsx',           true ],
    ['src/firestore-sync.jsx', true ],
    ['src/app.jsx',            true ],
  ];
  async function loadAll(){
    for (var i = 0; i < files.length; i++){
      var [path, isJsx] = files[i];
      try {
        var res  = await fetch(path + v, { cache: 'no-store' });
        var code = await res.text();
        if (isJsx) {
          code = Babel.transform(code, { presets: ['react'], filename: path }).code;
        }
        // Use a real <script> tag (not eval) so error stacks reference the file
        var s = document.createElement('script');
        s.text = code + '\n//# sourceURL=' + path;
        document.body.appendChild(s);
      } catch (err) {
        console.error('Failed to load', path, err);
      }
    }
  }
  loadAll();
})();
</script>
</body>
</html>
